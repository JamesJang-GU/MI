name: Update MI Dashboards

on:
  # 매주 월요일~금요일 한국시간 09:30 / 15:30 실행
  # GitHub Actions cron은 UTC 기준
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 6 * * 1-5"

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write

# 이전 실행이 끝나기 전에 다음 실행이 겹치지 않도록 방지
concurrency:
  group: mi-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboards:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. 저장소 및 기존 DB 다운로드
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =====================================================
      # 2. Python 설치
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 3. Chrome 설치
      # =====================================================
      - name: Set up Google Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # =====================================================
      # 4. Python 라이브러리 설치
      # =====================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas flask selenium webdriver-manager

      # =====================================================
      # 5. Shipping Index 크롤링 및 정적 파일 생성
      # =====================================================
      - name: Crawl Shipping Index and generate static dashboard
        env:
          KSG_ID: ${{ secrets.KSG_ID }}
          KSG_PW: ${{ secrets.KSG_PW }}
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python "Shipping Index/ShippingIndex_SCFI&BDI.py"

      # =====================================================
      # 6. Shipping Index 생성 파일 확인
      # =====================================================
      - name: Verify Shipping Index generated files
        run: |
          echo "===== Shipping Index files ====="
          ls -alh "Shipping Index"

          test -f "Shipping Index/index_history.db"
          test -f "Shipping Index/shipping_index_data.json"
          test -f "Shipping Index/index.html"

      # =====================================================
      # 7. Alphaliner 크롤링 및 정적 파일 생성
      # =====================================================
      - name: Crawl Alphaliner and generate static dashboard
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python "Alphaliner/alphaliner.py" --cron

      # =====================================================
      # 8. Alphaliner 생성 결과 확인
      # =====================================================
      - name: Verify Alphaliner generated files
        run: |
          echo "===== Alphaliner files ====="
          ls -alh "Alphaliner"

          test -f "Alphaliner/alphaliner_data.db"
          test -f "Alphaliner/alphaliner_data.json"
          test -f "Alphaliner/index.html"

          if grep -qF "Alphaliner Dashboard Template (alphaliner.html) Missing" "Alphaliner/index.html"; then
            echo "ERROR: Old Template Missing content still exists in Alphaliner/index.html"
            exit 1
          fi

          echo "Alphaliner index.html verification passed."

      # =====================================================
      # 8-1. Bunker Price 크롤링 및 정적 파일 생성
      # 실제 실행 경로: BunkerPrice/bunker_price.py
      # =====================================================
      - name: Crawl Bunker Price and generate static dashboard
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python "BunkerPrice/bunker_price.py"

      # =====================================================
      # 8-2. Bunker Price 생성 결과 확인
      # =====================================================
      - name: Verify Bunker Price generated files
        run: |
          echo "===== BunkerPrice files ====="
          ls -alh "BunkerPrice"

          test -f "BunkerPrice/energy_market_data.db"
          test -f "BunkerPrice/shipandbunker_vlsfo.csv"
          test -f "BunkerPrice/bunker_forecast.csv"
          test -f "BunkerPrice/index.html"

          echo "Bunker Price verification passed."

      # =====================================================
      # 8-3. 메인 포털 대시보드(루트 index.html) 생성
      # =====================================================
      - name: Generate Main Portal Dashboard
        run: |
          echo "===== Generating Portal Dashboard (index.html) ====="
          python dashboard_generator.py

          test -f "index.html"

      # =====================================================
      # 9. 변경된 DB / CSV / JSON / HTML을 한 번에 Commit & Push
      # =====================================================
      - name: Commit and push dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Shipping Index 생성 파일
          git add "Shipping Index/index_history.db"
          git add "Shipping Index/shipping_index_data.json"
          git add "Shipping Index/index.html"

          # Alphaliner 생성 파일
          git add "Alphaliner/alphaliner_data.db"
          git add "Alphaliner/alphaliner_data.json"
          git add "Alphaliner/index.html"
          git add "Alphaliner/alphaliner_crawl.log"

          # Bunker Price 생성 파일
          git add "BunkerPrice/energy_market_data.db"
          git add "BunkerPrice/shipandbunker_vlsfo.csv"
          git add "BunkerPrice/bunker_forecast.csv"
          git add "BunkerPrice/index.html"

          # 메인 포털 생성 파일
          git add "index.html"
          git add "dashboard_summary.json"

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Auto: update MI dashboards"
            git push
          fi
