name: Update Shipping Index Dashboard

on:
  # 매주 월요일~금요일 한국시간 09:30 / 15:30 실행
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 6 * * 1-5"

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 및 기존 DB 다운로드
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Chrome 설치
      # ubuntu-latest에는 통상 Chrome이 포함되지만,
      # 명시적으로 설치하여 Selenium 실행 실패 가능성을 낮춤
      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 4. 필요한 Python 라이브러리 설치
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium

      # 5. KSG 크롤링 → DB 저장 → JSON/HTML 생성
      - name: Crawl KSG and generate static dashboard
        env:
          KSG_ID: ${{ secrets.KSG_ID }}
          KSG_PW: ${{ secrets.KSG_PW }}
        run: |
          python "Shipping Index/ShippingIndex_SCFI&BDI.py"

      # 6. 생성 결과 확인
      - name: Verify generated files
        run: |
          ls -lh "Shipping Index"
          test -f "Shipping Index/index_history.db"
          test -f "Shipping Index/shipping_index_data.json"
          test -f "Shipping Index/index.html"

      # 7. 변경된 DB / JSON / HTML을 GitHub 저장소로 push
      - name: Commit and push dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Shipping Index/index_history.db"
          git add "Shipping Index/shipping_index_data.json"
          git add "Shipping Index/index.html"

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Update shipping index dashboard"
            git push
          fi
