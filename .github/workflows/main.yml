name: Update MI Dashboards

on:
  # 평일 KST 09:30 / 15:30
  # UTC 00:30 / 06:30
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 6 * * 1-5"

  # Actions 화면에서 수동 실행
  workflow_dispatch:

permissions:
  contents: write

# 동일 워크플로우의 동시 실행 방지
concurrency:
  group: mi-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboards:
    name: Update MI Data and Dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      # =====================================================
      # 1. 저장소 체크아웃
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =====================================================
      # 2. Python 설치
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # =====================================================
      # 3. Chrome / ChromeDriver 설치
      #    Selenium 기반 모듈용
      # =====================================================
      - name: Set up Google Chrome and matching ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Configure Chrome and ChromeDriver environment
        shell: bash
        run: |
          set -euo pipefail

          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          CHROMEDRIVER_PATH="${{ steps.setup-chrome.outputs.chromedriver-path }}"

          echo "Chrome path: ${CHROME_PATH}"
          echo "ChromeDriver path: ${CHROMEDRIVER_PATH}"

          if [ -n "${CHROME_PATH}" ] && [ -f "${CHROME_PATH}" ]; then
            dirname "${CHROME_PATH}" >> "$GITHUB_PATH"
          fi

          if [ -n "${CHROMEDRIVER_PATH}" ] && [ -f "${CHROMEDRIVER_PATH}" ]; then
            dirname "${CHROMEDRIVER_PATH}" >> "$GITHUB_PATH"
          fi

          echo "CHROME_BINARY=${CHROME_PATH}" >> "$GITHUB_ENV"
          echo "GOOGLE_CHROME_BIN=${CHROME_PATH}" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=${CHROMEDRIVER_PATH}" >> "$GITHUB_ENV"

      - name: Verify Chrome and ChromeDriver
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Google Chrome ====="
          "${CHROME_BINARY}" --version || true
          google-chrome --version || true

          echo "===== ChromeDriver ====="
          "${CHROMEDRIVER_PATH}" --version || true
          chromedriver --version || true

      # =====================================================
      # 4. Python 라이브러리 설치
      # =====================================================
      - name: Install Python packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      # =====================================================
      # 5. Playwright Chromium 설치
      #    Linerlytica 모듈용
      # =====================================================
      - name: Install Playwright Chromium and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      # =====================================================
      # 6. Shipping Index
      # =====================================================
      - name: Crawl Shipping Index and generate static dashboard
        env:
          KSG_ID: ${{ secrets.KSG_ID }}
          KSG_PW: ${{ secrets.KSG_PW }}
        shell: bash
        run: |
          set -euo pipefail
          python "Shipping Index/ShippingIndex_SCFI&BDI.py"

      - name: Verify Shipping Index generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Shipping Index files ====="
          ls -alh "Shipping Index"

          test -f "Shipping Index/index_history.db"
          test -f "Shipping Index/shipping_index_data.json"
          test -f "Shipping Index/index.html"
          test -s "Shipping Index/index.html"

          echo "Shipping Index verification passed."

      # =====================================================
      # 7. Alphaliner
      # =====================================================
      - name: Crawl Alphaliner and generate static dashboard
        shell: bash
        run: |
          set -euo pipefail

          # 실제 표준 파일명: Alphaliner/alphaliner.py
          if [ -f "Alphaliner/alphaliner.py" ]; then
            python "Alphaliner/alphaliner.py" --cron
          elif [ -f "Alphaliner/Alphaliner.py" ]; then
            python "Alphaliner/Alphaliner.py" --cron
          else
            echo "ERROR: Alphaliner Python script was not found."
            exit 1
          fi

      - name: Verify Alphaliner generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Alphaliner files ====="
          ls -alh "Alphaliner"

          test -f "Alphaliner/alphaliner_history.db"
          test -f "Alphaliner/alphaliner_data.json"
          test -f "Alphaliner/index.html"
          test -s "Alphaliner/index.html"

          if grep -qF \
            "Alphaliner Dashboard Template (alphaliner.html) Missing" \
            "Alphaliner/index.html"; then
            echo "ERROR: Old Template Missing content exists in Alphaliner/index.html"
            exit 1
          fi

          echo "Alphaliner verification passed."

      # =====================================================
      # 8. Forwarder
      # =====================================================
      - name: Crawl Forwarder and generate static dashboard
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Forwarder folder structure ====="
          find "Forwarder" -maxdepth 3 -type f | sort

          FORWARDER_SCRIPT=$(
            grep -rl \
              --include="*.py" \
              "A&A Top 25 Dashboard" \
              "Forwarder" | head -n 1
          )

          if [ -z "${FORWARDER_SCRIPT}" ]; then
            echo "ERROR: Forwarder Python script was not found."
            exit 1
          fi

          echo "Forwarder script found: ${FORWARDER_SCRIPT}"
          python "${FORWARDER_SCRIPT}"

      - name: Verify Forwarder generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Forwarder files ====="
          ls -alh "Forwarder"

          test -f "Forwarder/freight_forwarders_data.db"
          test -f "Forwarder/freight_forwarders_history.csv"
          test -f "Forwarder/index.html"
          test -s "Forwarder/index.html"

          grep -qF "FORWARDER MONITOR" "Forwarder/index.html"
          grep -qF "MI&lt;GO&gt;" "Forwarder/index.html"

          grep -qF 'id="currentDateSelect"' "Forwarder/index.html"
          grep -qF 'id="compareDateSelect"' "Forwarder/index.html"
          grep -qF 'id="rankingTableBody"' "Forwarder/index.html"

          echo "Forwarder verification passed."

      # =====================================================
      # 9. Bunker Price / Crude Oil
      # =====================================================
      - name: Crawl Bunker Price and generate static dashboard
        shell: bash
        run: |
          set -euo pipefail
          python "BunkerPrice/bunker_price.py" --build-static --refresh

      - name: Verify Bunker Price generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== BunkerPrice files ====="
          ls -alh "BunkerPrice"

          echo "===== OilPrice files ====="
          ls -alh "BunkerPrice/OilPrice"

          test -f "BunkerPrice/bunker_price_data.db"
          test -f "BunkerPrice/shipandbunker_vlsfo.csv"
          test -f "BunkerPrice/index.html"
          test -s "BunkerPrice/index.html"

          test -f "BunkerPrice/OilPrice/index.html"
          test -s "BunkerPrice/OilPrice/index.html"
          test -f "BunkerPrice/OilPrice/opinet_oil_prices.csv"

          if [ ! -f "BunkerPrice/bunker_forecast.csv" ]; then
            echo "WARNING: bunker_forecast.csv was not generated."
          fi

          echo "Bunker Price / Crude Oil verification passed."

      # =====================================================
      # 10. Linerlytica
      # =====================================================
      - name: Crawl Linerlytica and generate static dashboard
        shell: bash
        run: |
          set -euo pipefail
          python "Linerlytica/Linerlytica.py"

      - name: Verify Linerlytica generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Linerlytica files ====="
          ls -alh "Linerlytica"

          test -f "Linerlytica/Linerlytica.db"
          test -f "Linerlytica/index.html"
          test -s "Linerlytica/index.html"

          echo "Linerlytica verification passed."

      # =====================================================
      # 11. Macro Economies / GDP / Inflation / GSCPI
      #    폴더명 변경: GDP&Inflation -> MacroEconomies
      # =====================================================
      - name: Update Macro Economies and GSCPI dashboard
        shell: bash
        run: |
          set -euo pipefail
          python "MacroEconomies/GDP_Inflation_GSCPI_DB.py" --cron

      - name: Verify Macro Economies generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== MacroEconomies files ====="
          ls -alh "MacroEconomies"

          test -f "MacroEconomies/gdp_inflation_gscpi_cache.db"
          test -f "MacroEconomies/macro_data.json"
          test -f "MacroEconomies/gscpi_data.json"
          test -f "MacroEconomies/dashboard_meta.json"
          test -f "MacroEconomies/index.html"

          test -s "MacroEconomies/macro_data.json"
          test -s "MacroEconomies/gscpi_data.json"
          test -s "MacroEconomies/index.html"

          echo "Macro Economies verification passed."

      # =====================================================
      # 12. 루트 MI 포털 생성
      #    개별 대시보드 생성이 전부 끝난 뒤 실행해야 함
      # =====================================================
      - name: Generate Main Portal Dashboard
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Generating Root MI Portal ====="
          python dashboard_generator.py

          test -f "index.html"
          test -s "index.html"
          test -f "dashboard_summary.json"

          echo "Root MI Portal verification passed."

      # =====================================================
      # 13. 변경 파일 Commit / Push
      # =====================================================
      - name: Commit and push dashboard data
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 신규·수정·삭제·이동 파일을 모두 포함
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto: update MI dashboards [skip ci]"

          # 수동 커밋 또는 다른 Actions 실행과의 경합에 대비
          for i in 1 2 3; do
            echo "===== Push attempt ${i}/3 ====="

            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Dashboard data successfully pushed."
              exit 0
            fi

            echo "[WARN] Push attempt ${i} failed."

            # rebase 충돌 상태일 경우 원래 커밋 상태로 복구
            git rebase --abort || true

            if [ "${i}" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "ERROR: Failed to push changes after 3 attempts."
          exit 1
