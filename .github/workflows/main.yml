name: Update Market Intelligence Dashboard

on:
  workflow_dispatch:

  schedule:
    # 매일 KST 00:00 실행
    # GitHub Actions cron은 UTC 기준
    - cron: "0 15 * * *"

permissions:
  contents: write

jobs:
  crawl-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Shipping Index Python 파일만 사전에 문법 검사
      # 오류가 있으면 크롤러 실행 전에 여기서 실패하며 줄 번호가 표시됨
      - name: Validate Shipping Index Python syntax
        run: |
          python -m py_compile "Shipping Index/ShippingIndex_SCFI&BDI.py"

      - name: Run crawler and generate dashboards
        env:
          KSG_ID: ${{ secrets.KSG_ID }}
          KSG_PW: ${{ secrets.KSG_PW }}
        run: |
          python run_all.py

      - name: Check generated files
        run: |
          echo "=== Main portal files ==="
          test -f "index.html"
          test -f "dashboard_summary.json"

          echo "=== Shipping Index files ==="
          test -f "Shipping Index/index.html"
          test -f "Shipping Index/shipping_index_data.json"

          echo "=== Shipping JSON preview ==="
          head -c 500 "Shipping Index/shipping_index_data.json"
          echo ""

          echo "=== Git status before staging ==="
          git status --short

      - name: Commit and push updated dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 상세 Shipping Index 대시보드에서 fetch()로 직접 읽는 필수 파일
          # -f: .gitignore 규칙이 있어도 강제로 Git 추적 대상으로 추가
          git add -f "Shipping Index/shipping_index_data.json"

          # Shipping 상세 화면
          git add "Shipping Index/index.html"

          # Market Intelligence Portal 메인 화면 및 요약 데이터
          git add "index.html"
          git add "dashboard_summary.json"

          echo "=== Staged files ==="
          git diff --cached --name-only

          if git diff --cached --quiet; then
            echo "No dashboard file changes to commit."
          else
            git commit -m "Auto: update MI dashboard data [$(date -u +'%Y-%m-%d')]"
            git push
          fi
