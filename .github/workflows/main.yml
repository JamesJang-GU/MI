name: Update MI Dashboards

on:
  # 매주 월요일~금요일 한국시간 09:30 / 15:30 실행 (UTC 00:30, 06:30)
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 6 * * 1-5"

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write

# 동시 실행 방지
concurrency:
  group: mi-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboards:
    name: Update MI Data and Dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      # =====================================================
      # 1. 저장소 체크아웃
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =====================================================
      # 2. Python 설치
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # =====================================================
      # 3. Chrome 및 호환 ChromeDriver 설치 & 환경변수 글로벌 등록
      # =====================================================
      - name: Set up Google Chrome and matching ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Configure Chrome and ChromeDriver in Global Environment
        shell: bash
        run: |
          set -euo pipefail

          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          CHROMEDRIVER_PATH="${{ steps.setup-chrome.outputs.chromedriver-path }}"

          echo "Chrome path: ${CHROME_PATH}"
          echo "ChromeDriver path: ${CHROMEDRIVER_PATH}"

          # PATH에 바이너리 디렉토리 추가
          if [ -n "${CHROME_PATH}" ] && [ -f "${CHROME_PATH}" ]; then
            dirname "${CHROME_PATH}" >> "$GITHUB_PATH"
          fi

          if [ -n "${CHROMEDRIVER_PATH}" ] && [ -f "${CHROMEDRIVER_PATH}" ]; then
            dirname "${CHROMEDRIVER_PATH}" >> "$GITHUB_PATH"
          fi

          # 이후 모든 스텝에서 사용할 수 있도록 GITHUB_ENV에 등록
          echo "CHROME_BINARY=${CHROME_PATH}" >> "$GITHUB_ENV"
          echo "GOOGLE_CHROME_BIN=${CHROME_PATH}" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=${CHROMEDRIVER_PATH}" >> "$GITHUB_ENV"

      - name: Verify Chrome and ChromeDriver environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Google Chrome version ====="
          "${CHROME_BINARY}" --version || true
          google-chrome --version || true

          echo "===== ChromeDriver version ====="
          "${CHROMEDRIVER_PATH}" --version || true
          chromedriver --version || true

          echo "===== Global Environment Variables ====="
          echo "CHROME_BINARY: ${CHROME_BINARY}"
          echo "CHROMEDRIVER_PATH: ${CHROMEDRIVER_PATH}"

      # =====================================================
      # 4. Python 라이브러리 설치
      # =====================================================
      - name: Install Python packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      # =====================================================
      # 5. Playwright Chromium 및 Linux 시스템 의존성 설치
      # =====================================================
      - name: Install Playwright Chromium and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      # =====================================================
      # 6. Shipping Index 크롤링 및 정적 파일 생성
      # =====================================================
      - name: Crawl Shipping Index and generate static dashboard
        env:
          KSG_ID: ${{ secrets.KSG_ID }}
          KSG_PW: ${{ secrets.KSG_PW }}
        shell: bash
        run: |
          set -euo pipefail
          python "Shipping Index/ShippingIndex_SCFI&BDI.py"

      # =====================================================
      # 7. Shipping Index 생성 파일 확인
      # =====================================================
      - name: Verify Shipping Index generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Shipping Index files ====="
          ls -alh "Shipping Index"

          test -f "Shipping Index/index_history.db"
          test -f "Shipping Index/shipping_index_data.json"
          test -f "Shipping Index/index.html"

          echo "Shipping Index verification passed."

      # =====================================================
      # 8. Alphaliner 크롤링 및 정적 파일 생성
      # =====================================================
      - name: Crawl Alphaliner and generate static dashboard
        shell: bash
        run: |
          set -euo pipefail

          # 대소문자 차이 방지를 위해 존재하는 스크립트 실행
          if [ -f "Alphaliner/Alphaliner.py" ]; then
            python "Alphaliner/Alphaliner.py" --cron
          elif [ -f "Alphaliner/alphaliner.py" ]; then
            python "Alphaliner/alphaliner.py" --cron
          else
            echo "ERROR: Alphaliner Python script was not found."
            exit 1
          fi

      # =====================================================
      # 9. Alphaliner 생성 결과 확인
      # =====================================================
      - name: Verify Alphaliner generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Alphaliner files ====="
          ls -alh "Alphaliner"

          test -f "Alphaliner/alphaliner_history.db"
          test -f "Alphaliner/alphaliner_data.json"
          test -f "Alphaliner/index.html"
          test -s "Alphaliner/index.html"

          if grep -qF \
            "Alphaliner Dashboard Template (alphaliner.html) Missing" \
            "Alphaliner/index.html"; then
            echo "ERROR: Old Template Missing content still exists in Alphaliner/index.html"
            exit 1
          fi

          echo "Alphaliner verification passed."

      # =====================================================
      # 10. Forwarder 크롤링 및 정적 파일 생성
      # =====================================================
      - name: Crawl Forwarder and generate static dashboard
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Forwarder folder structure ====="
          find "Forwarder" -maxdepth 3 -type f | sort

          FORWARDER_SCRIPT=$(
            grep -rl \
              --include="*.py" \
              "A&A Top 25 Dashboard" \
              "Forwarder" | head -n 1
          )

          if [ -z "$FORWARDER_SCRIPT" ]; then
            echo "ERROR: Forwarder Python script was not found."
            exit 1
          fi

          echo "Forwarder script found: $FORWARDER_SCRIPT"
          python "$FORWARDER_SCRIPT"

          echo "===== Forwarder output files ====="
          ls -alh "Forwarder"

      # =====================================================
      # 11. Forwarder 생성 결과 확인
      # =====================================================
      - name: Verify Forwarder generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Verify Forwarder files ====="
          ls -alh "Forwarder"

          test -f "Forwarder/freight_forwarders_data.db" \
            || { echo "ERROR: freight_forwarders_data.db is missing."; exit 1; }

          test -f "Forwarder/freight_forwarders_history.csv" \
            || { echo "ERROR: freight_forwarders_history.csv is missing."; exit 1; }

          test -f "Forwarder/index.html" \
            || { echo "ERROR: index.html is missing."; exit 1; }

          test -s "Forwarder/index.html" \
            || { echo "ERROR: index.html is empty."; exit 1; }

          echo "===== Dashboard identity verification ====="
          grep -qF "FORWARDER MONITOR" "Forwarder/index.html" \
            || { echo "ERROR: FORWARDER MONITOR identifier is missing."; exit 1; }

          grep -qF "MI&lt;GO&gt;" "Forwarder/index.html" \
            || { echo "ERROR: MI&lt;GO&gt; terminal label is missing."; exit 1; }

          echo "===== Historical comparison UI verification ====="
          grep -qF 'id="currentDateSelect"' "Forwarder/index.html" \
            || { echo "ERROR: currentDateSelect control is missing."; exit 1; }

          grep -qF 'id="compareDateSelect"' "Forwarder/index.html" \
            || { echo "ERROR: compareDateSelect control is missing."; exit 1; }

          grep -qF 'id="rankingTableBody"' "Forwarder/index.html" \
            || { echo "ERROR: rankingTableBody is missing."; exit 1; }

          echo "Forwarder dashboard verification passed."

      # =====================================================
      # 12. Bunker Price / Crude Oil 크롤링 및 정적 파일 생성
      # =====================================================
      - name: Crawl Bunker Price and generate static dashboard
        shell: bash
        run: |
          set -euo pipefail
          python "BunkerPrice/bunker_price.py" --build-static --refresh

      # =====================================================
      # 13. Bunker Price / Crude Oil 생성 결과 확인
      # =====================================================
      - name: Verify Bunker Price generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== BunkerPrice files ====="
          ls -alh "BunkerPrice"

          echo "===== OilPrice files ====="
          ls -alh "BunkerPrice/OilPrice"

          test -f "BunkerPrice/bunker_price_data.db" \
            || { echo "ERROR: bunker_price_data.db is missing."; exit 1; }

          test -f "BunkerPrice/shipandbunker_vlsfo.csv" \
            || { echo "ERROR: shipandbunker_vlsfo.csv is missing."; exit 1; }

          test -f "BunkerPrice/index.html" \
            || { echo "ERROR: BunkerPrice/index.html is missing."; exit 1; }

          test -s "BunkerPrice/index.html" \
            || { echo "ERROR: BunkerPrice/index.html is empty."; exit 1; }

          test -f "BunkerPrice/OilPrice/index.html" \
            || { echo "ERROR: OilPrice/index.html is missing."; exit 1; }

          test -s "BunkerPrice/OilPrice/index.html" \
            || { echo "ERROR: OilPrice/index.html is empty."; exit 1; }

          test -f "BunkerPrice/OilPrice/opinet_oil_prices.csv" \
            || { echo "ERROR: opinet_oil_prices.csv is missing."; exit 1; }

          if [ ! -f "BunkerPrice/bunker_forecast.csv" ]; then
            echo "WARNING: bunker_forecast.csv was not generated."
          fi

          echo "Bunker Price / Crude Oil dashboard verification passed."

      # =====================================================
      # 14. Linerlytica 크롤링 및 정적 파일 생성
      # =====================================================
      - name: Crawl Linerlytica and generate static dashboard
        shell: bash
        run: |
          set -euo pipefail
          python "Linerlytica/Linerlytica.py"

      # =====================================================
      # 15. Linerlytica 생성 결과 확인
      # =====================================================
      - name: Verify Linerlytica generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Linerlytica files ====="
          ls -alh "Linerlytica"

          test -f "Linerlytica/Linerlytica.db"
          test -f "Linerlytica/index.html"
          test -s "Linerlytica/index.html"

          echo "Linerlytica verification passed."

      # =====================================================
      # 16. 메인 포털 대시보드(루트 index.html) 생성
      # =====================================================
      - name: Generate Main Portal Dashboard
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Generating Portal Dashboard (index.html) ====="
          python dashboard_generator.py

          test -f "index.html"
          test -s "index.html"
          test -f "dashboard_summary.json"

          echo "Main Portal Dashboard verification passed."

      # =====================================================
      # 17. 변경된 DB / CSV / JSON / HTML Commit & Push
      # =====================================================
      - name: Commit and push dashboard data
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 변경된 파일이 있는지 확인
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto: update MI dashboards [skip ci]" || exit 0

            # 2. 푸시 전 원격 최신 커밋을 rebase로 통합 (최대 3회 재시도)
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break || {
                echo "[WARN] Push failed. Retrying ($i/3)..."
                sleep 3
              }
            done
          else
            echo "No changes to commit."
          fi
