name: Update MI Dashboards

on:
  # 매주 월요일~금요일 한국시간 09:30 / 15:30 실행
  # GitHub Actions cron은 UTC 기준
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 6 * * 1-5"

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write

# 이전 실행이 끝나기 전에 다음 실행이 겹치지 않도록 방지
concurrency:
  group: mi-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboards:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. 저장소 및 기존 DB 다운로드
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =====================================================
      # 2. Python 설치
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 3. Chrome 설치
      # =====================================================
      - name: Set up Google Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # =====================================================
      # 4. Python 라이브러리 설치
      # =====================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            flask \
            selenium \
            webdriver-manager \
            beautifulsoup4 \
            lxml \
            html5lib \
            plotly

      # =====================================================
      # 5. Shipping Index 크롤링 및 정적 파일 생성
      # =====================================================
      - name: Crawl Shipping Index and generate static dashboard
        env:
          KSG_ID: ${{ secrets.KSG_ID }}
          KSG_PW: ${{ secrets.KSG_PW }}
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python "Shipping Index/ShippingIndex_SCFI&BDI.py"

      # =====================================================
      # 6. Shipping Index 생성 파일 확인
      # =====================================================
      - name: Verify Shipping Index generated files
        run: |
          echo "===== Shipping Index files ====="
          ls -alh "Shipping Index"

          test -f "Shipping Index/index_history.db"
          test -f "Shipping Index/shipping_index_data.json"
          test -f "Shipping Index/index.html"

      # =====================================================
      # 7. Alphaliner 크롤링 및 정적 파일 생성
      # =====================================================
      - name: Crawl Alphaliner and generate static dashboard
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python "Alphaliner/alphaliner.py" --cron

      # =====================================================
      # 8. Alphaliner 생성 결과 확인
      # =====================================================
      - name: Verify Alphaliner generated files
        run: |
          echo "===== Alphaliner files ====="
          ls -alh "Alphaliner"

          test -f "Alphaliner/alphaliner_data.db"
          test -f "Alphaliner/alphaliner_data.json"
          test -f "Alphaliner/index.html"

          echo "===== Alphaliner index.html first 10 lines ====="
          head -n 10 "Alphaliner/index.html"

          echo "===== Check old Template Missing text ====="
          if grep -qF "Alphaliner Dashboard Template (alphaliner.html) Missing" "Alphaliner/index.html"; then
            echo "ERROR: Old Template Missing content still exists in Alphaliner/index.html"
            exit 1
          fi

          echo "Alphaliner index.html verification passed."

      # =====================================================
      # 8-1. Bunker Price / Crude Oil 크롤링 및 정적 파일 생성
      # --crawl-only:
      # VLSFO + Forecast + Dubai/Brent/WTI 데이터를 수집하고
      # Bunker Price/index.html 및 OilPrice/index.html 생성
      # =====================================================
      - name: Crawl Bunker Price and Crude Oil dashboards
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python "Bunker Price/energy_market_dashboard.py" --crawl-only

      # =====================================================
      # 8-2. Bunker Price / Crude Oil 생성 결과 확인
      # =====================================================
      - name: Verify Bunker Price and Crude Oil generated files
        run: |
          echo "===== Bunker Price files ====="
          ls -alh "Bunker Price"

          echo "===== OilPrice files ====="
          ls -alh "Bunker Price/OilPrice"

          # Bunker Price 생성 파일
          test -f "Bunker Price/energy_market_data.db"
          test -f "Bunker Price/shipandbunker_vlsfo.csv"
          test -f "Bunker Price/bunker_forecast.csv"
          test -f "Bunker Price/index.html"

          # Crude Oil 생성 파일
          test -f "Bunker Price/OilPrice/opinet_oil_prices.csv"
          test -f "Bunker Price/OilPrice/index.html"

          echo "===== Verify Bunker Price dashboard title ====="
          grep -qF "VLSFO BUNKER PRICE" "Bunker Price/index.html"

          echo "===== Verify Crude Oil dashboard title ====="
          grep -qF "INTERNATIONAL CRUDE OIL PRICE" "Bunker Price/OilPrice/index.html"

          echo "Bunker Price and Crude Oil verification passed."

      # =====================================================
      # 8-3. 메인 포털 대시보드(루트 index.html) 생성
      # Bunker Price 파일 생성 후 실행
      # =====================================================
      - name: Generate Main Portal Dashboard
        run: |
          echo "===== Generating Portal Dashboard (index.html) ====="

          python dashboard_generator.py

          # 루트 index.html 정상 생성 검증
          test -f "index.html"

      # =====================================================
      # 9. 변경된 DB / CSV / JSON / HTML을 한 번에 Commit & Push
      # =====================================================
      - name: Commit and push dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -------------------------------------------------
          # Shipping Index 생성 파일
          # -------------------------------------------------
          git add "Shipping Index/index_history.db"
          git add "Shipping Index/shipping_index_data.json"
          git add "Shipping Index/index.html"

          # -------------------------------------------------
          # Alphaliner 생성 파일
          # -------------------------------------------------
          git add "Alphaliner/alphaliner_data.db"
          git add "Alphaliner/alphaliner_data.json"
          git add "Alphaliner/index.html"
          git add "Alphaliner/alphaliner_crawl.log"

          # -------------------------------------------------
          # Bunker Price / VLSFO 생성 파일
          # -------------------------------------------------
          git add "Bunker Price/energy_market_data.db"
          git add "Bunker Price/shipandbunker_vlsfo.csv"
          git add "Bunker Price/bunker_forecast.csv"
          git add "Bunker Price/index.html"

          # -------------------------------------------------
          # Crude Oil / Opinet 생성 파일
          # -------------------------------------------------
          git add "Bunker Price/OilPrice/opinet_oil_prices.csv"
          git add "Bunker Price/OilPrice/index.html"

          # -------------------------------------------------
          # 메인 포털 생성 파일
          # -------------------------------------------------
          git add "index.html"
          git add "dashboard_summary.json"

          # 변경사항이 있는 경우에만 Commit / Push
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Auto: update MI dashboards"
            git push
          fi
